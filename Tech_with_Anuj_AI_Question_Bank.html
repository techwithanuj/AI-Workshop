<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech with Anuj | AI Learning Series – 50 Question Bank</title>
<style>
:root{
  --primary:#5b4bdb; --primary2:#7c3aed; --bg:#f6f7fb; --card:#fff;
  --text:#1f2937; --muted:#6b7280; --green:#16a34a; --red:#dc2626;
  --border:#e5e7eb; --shadow:0 10px 30px rgba(31,41,55,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{background:linear-gradient(135deg,#4338ca,#7c3aed);color:#fff;padding:28px 16px 34px;text-align:center}
header h1{margin:0;font-size:clamp(25px,5vw,40px)}
header p{margin:7px 0 0;opacity:.92;font-size:16px}
.container{max-width:1050px;margin:-18px auto 40px;padding:0 14px}
.toolbar{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:grid;gap:10px}
.search{display:flex;gap:8px}
input[type=search]{width:100%;border:1px solid var(--border);border-radius:12px;padding:13px 14px;font-size:15px;outline:none}
input[type=search]:focus{border-color:var(--primary)}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:2px}
.filter{border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 13px;white-space:nowrap;cursor:pointer}
.filter.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.stats{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
.progress-wrap{flex:1;min-width:220px}
.progress{height:9px;background:#ececf5;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#16a34a);transition:.3s}
.stats small{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:600;background:#eef2ff;color:#4338ca}
.btn.primary{background:var(--primary);color:#fff}
.btn.danger{background:#fee2e2;color:#991b1b}
.section-title{margin:28px 3px 12px;font-size:18px;color:#374151}
.question{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 5px 18px rgba(31,41,55,.04)}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badge{font-size:12px;background:#ede9fe;color:#5b21b6;padding:5px 9px;border-radius:999px;white-space:nowrap}
.qnum{font-weight:800;color:var(--primary)}
.question h3{margin:8px 0 14px;font-size:18px;line-height:1.55}
.options{display:grid;gap:8px}
.option{border:1px solid var(--border);background:#fafafa;border-radius:12px;padding:11px 13px;cursor:pointer;transition:.2s;text-align:left;width:100%;font-size:15px}
.option:hover{border-color:#a5b4fc;background:#f5f3ff}
.option.selected{border-color:#818cf8;background:#eef2ff}
.option.correct{border-color:#86efac;background:#f0fdf4;color:#166534}
.option.wrong{border-color:#fecaca;background:#fef2f2;color:#991b1b}
.answer{display:none;margin-top:12px;border-radius:12px;padding:12px 14px;background:#f8fafc;border-left:4px solid var(--green)}
.answer.show{display:block}
.answer strong{color:#166534}
.explain{margin-top:5px;color:#4b5563;font-size:14px}
.empty{padding:35px;text-align:center;color:var(--muted);background:#fff;border-radius:16px}
.quiz-panel{display:none;background:#fff;border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-top:20px}
.quiz-panel.active{display:block}
.quiz-q{font-size:21px;font-weight:700;margin:12px 0}
.quiz-options{display:grid;gap:9px}
.quiz-result{text-align:center;padding:18px;background:#f8fafc;border-radius:14px;margin-top:15px}
footer{text-align:center;color:#6b7280;padding:25px 10px;font-size:13px}
@media(max-width:600px){.question{padding:16px}.qhead{flex-direction:column}.stats{align-items:stretch}.actions{width:100%}.actions .btn{flex:1}}
</style>
</head>

let activeCat="सभी", searchTerm="";
let seen = JSON.parse(localStorage.getItem("techAnujSeen")||"[]");
let answered = JSON.parse(localStorage.getItem("techAnujAnswered")||"[]");

const filters=document.getElementById("filters");
const questionsEl=document.getElementById("questions");
const cats=["सभी",...new Set(questions.map(x=>x.cat))];

cats.forEach(c=>{
  const b=document.createElement("button"); b.className="filter"+(c==="सभी"?" active":""); b.textContent=c;
  b.onclick=()=>{activeCat=c;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()};
  filters.appendChild(b);
});

document.getElementById("search").addEventListener("input",e=>{searchTerm=e.target.value.toLowerCase();render()});

function render(){
  const list=questions.map((q,i)=>({...q,i})).filter(x=>
    (activeCat==="सभी"||x.cat===activeCat) &&
    (x.q.toLowerCase().includes(searchTerm)||x.cat.toLowerCase().includes(searchTerm)||x.o.join(" ").toLowerCase().includes(searchTerm))
  );
  document.getElementById("countTitle").textContent=`${list.length} प्रश्न`;
  if(!list.length){questionsEl.innerHTML='<div class="empty">😕 कोई प्रश्न नहीं मिला। Search या category बदलकर देखें।</div>';return}
  questionsEl.innerHTML=list.map(item=>card(item)).join("");
}
function card(x){
 return `<article class="question" id="q${x.i}">
  <div class="qhead"><div class="qnum">प्रश्न ${x.i+1}</div><span class="badge">${x.cat}</span></div>
  <h3>${escapeHtml(x.q)}</h3>
  <div class="options">${x.o.map((o,j)=>`<button class="option" onclick="choose(${x.i},${j},this)"><b>${String.fromCharCode(65+j)}.</b> ${escapeHtml(o)}</button>`).join("")}</div>
  <div class="answer ${seen.includes(x.i)?"show":""}" id="ans${x.i}">
    <strong>✓ सही उत्तर: ${String.fromCharCode(65+x.a)}. ${escapeHtml(x.o[x.a])}</strong>
    <div class="explain">💡 ${escapeHtml(x.e)}</div>
  </div>
 </article>`;
}
function choose(i,j,el){
  seen=[...new Set([...seen,i])]; localStorage.setItem("techAnujSeen",JSON.stringify(seen));
  const q=questions[i], parent=el.closest(".question");
  parent.querySelectorAll(".option").forEach((b,k)=>{b.classList.remove("selected","correct","wrong");if(k===q.a)b.classList.add("correct")});
  if(j!==q.a)el.classList.add("wrong"); else el.classList.add("selected");
  document.getElementById("ans"+i).classList.add("show"); updateProgress();
}
function updateProgress(){
 const p=Math.round((seen.length/questions.length)*100);
 document.getElementById("progressBar").style.width=p+"%";
 document.getElementById("progressText").textContent=`${seen.length} / ${questions.length} प्रश्न देखे/attempt किए गए`;
}
function showAll(){
 questions.forEach((q,i)=>{if(!seen.includes(i))seen.push(i)});
 localStorage.setItem("techAnujSeen",JSON.stringify(seen)); render(); updateProgress();
}
function resetBank(){
 if(confirm("क्या आप progress reset करना चाहते हैं?")){seen=[];answered=[];localStorage.removeItem("techAnujSeen");localStorage.removeItem("techAnujAnswered");render();updateProgress()}
}
function startQuiz(){
 const panel=document.getElementById("quizPanel"); panel.classList.add("active");
 let idx=0,score=0;
 function draw(){
   if(idx>=10){panel.innerHTML=`<div class="quiz-result"><h2>🎉 Quiz Complete!</h2><div style="font-size:30px;font-weight:800;color:#16a34a">${score}/10</div><p>आपने 10 random questions attempt किए।</p><button class="btn primary" onclick="startQuiz()">🔄 Try Again</button></div>`;panel.scrollIntoView({behavior:"smooth"});return}
   const q=questions[Math.floor(Math.random()*questions.length)];
   panel.innerHTML=`<div class="qhead"><span class="badge">Quick Quiz • ${idx+1}/10</span><button class="btn" onclick="document.getElementById('quizPanel').classList.remove('active')">✕ Close</button></div>
   <div class="quiz-q">${escapeHtml(q.q)}</div><div class="quiz-options">${q.o.map((o,j)=>`<button class="option" onclick="quizAnswer(${j},${q.a},this)">${String.fromCharCode(65+j)}. ${escapeHtml(o)}</button>`).join("")}</div><div id="quizFeedback"></div>`;
   window.quizAnswer=(choice,correct,button)=>{
     panel.querySelectorAll(".option").forEach((b,k)=>{b.disabled=true;if(k===correct)b.classList.add("correct")});
     const f=document.getElementById("quizFeedback");
     if(choice===correct){score++;f.innerHTML='<div class="answer show"><strong>✅ सही उत्तर!</strong></div>'}
     else f.innerHTML='<div class="answer show"><strong>❌ सही उत्तर: '+String.fromCharCode(65+correct)+'</strong></div>';
     setTimeout(()=>{idx++;draw()},700);
   };
 }
 draw(); panel.scrollIntoView({behavior:"smooth"});
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render(); updateProgress();
</script>
